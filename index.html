<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mi Español - 80 exercices</title><style>*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:#f7f5f2;color:#17251f}header{background:#17251f;color:white;padding:18px 5%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}button{cursor:pointer}.profiles button,.nav button,.cats button{border:0;padding:10px 13px;border-radius:12px;margin:2px}.on{background:#ef6b45!important;color:white}.wrap{max-width:1100px;margin:auto;padding:22px}.nav{display:flex;gap:6px;overflow:auto;margin-bottom:20px}.nav button{background:#17251f;color:white}.hero{background:linear-gradient(135deg,#d9483b,#ef6b45,#f3ae3d);color:white;border-radius:28px;padding:30px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:white;border-radius:22px;padding:20px;box-shadow:0 3px 12px #0001}.cats{display:flex;overflow:auto;margin-bottom:12px}.cats button{white-space:nowrap}.exerciseList{display:grid;gap:8px}.exerciseList button{text-align:left;border:0;background:white;border-radius:14px;padding:12px}.exerciseList button.done{border-left:6px solid #16a34a}.coach{max-width:760px}.question{background:#edf2f0;border-radius:16px;padding:18px}.listen,.mic,.check{width:100%;border:0;border-radius:14px;padding:13px;font-weight:800;margin-top:10px}.listen{background:#fff4e5;color:#9a5b00}.mic{border:2px solid #d9483b;background:#fff5f3;color:#d9483b}.mic.live{background:#d9483b;color:white}.check{background:#17251f;color:white}.check:disabled{opacity:.4}textarea{width:100%;min-height:105px;margin-top:12px;padding:14px;border:1px solid #ccd6d1;border-radius:14px;font:inherit}.feedback{background:#ecfdf5;border-radius:16px;padding:16px;margin-top:12px}.hide{display:none}.progress{height:10px;background:#eee;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:#16a34a}.error{background:#fef2f2;color:#b42318;padding:10px;border-radius:10px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><header><b>🇪🇸 Mi Español · 80 exercices A0</b><div class="profiles"><button data-user="Patricia" class="on">Patricia</button><button data-user="Marie-Christine">Marie-Christine</button></div></header><main class="wrap"><div class="nav"><button data-page="home">Accueil</button><button data-page="learn">Exercices</button><button data-page="progress">Progression</button></div><section id="home"><div class="hero"><h1>80 exercices vocaux utiles</h1><p>10 exercices dans chacune des 8 catégories, avec écoute, micro, transcription et score.</p><button class="listen" onclick="show('learn')">Commencer</button></div><div class="grid" id="summary" style="margin-top:16px"></div></section><section id="learn" class="hide"><div class="cats" id="cats"></div><div class="grid"><div><h2 id="catTitle"></h2><div class="exerciseList" id="exerciseList"></div></div><div class="card coach"><small id="counter"></small><div class="question"><h2 id="q"></h2><p id="fr"></p><button class="listen" id="listen">🔊 Écouter</button></div><textarea id="answer" placeholder="Parlez ou écrivez votre réponse…"></textarea><button id="mic" class="mic">🎤 Répondre au micro</button><p id="err" class="error hide"></p><button id="check" class="check" disabled>Corriger</button><div id="feedback" class="feedback hide"><b id="score"></b><p>✅ <span id="model"></span></p><p>🗣 <span id="pron"></span></p></div></div></div></section><section id="progress" class="hide"><h1 id="ptitle"></h1><div class="grid" id="pstats"></div><div class="card" style="margin-top:14px"><h2>Progression par catégorie</h2><div id="pcats"></div></div></section></main><script>const DATA={"daily": ["1. Vie quotidienne", [["Hola, ¿cómo está?", "Bonjour, comment allez-vous ?", "Muy bien, gracias. ¿Y usted?", "mouï biène, grassias, i oustèd"], ["¿Cómo se llama?", "Comment vous appelez-vous ?", "Me llamo Patricia.", "mé yamo Patricia"], ["¿De dónde es?", "D’où êtes-vous ?", "Soy de Bélgica.", "soï dé Bèl-hika"], ["¿Habla francés?", "Parlez-vous français ?", "Sí, hablo francés.", "si, ablo fransès"], ["¿Dónde está el supermercado?", "Où est le supermarché ?", "Está cerca de aquí.", "ésta sèrka dé aki"], ["¿Qué hora es?", "Quelle heure est-il ?", "Son las diez.", "son las dièss"], ["¿Cuánto cuesta?", "Combien cela coûte-t-il ?", "Cuesta cinco euros.", "kouèsta sinko é-ouros"], ["¿Puede ayudarme?", "Pouvez-vous m’aider ?", "Sí, claro.", "si, klaro"], ["¿Dónde está el baño?", "Où sont les toilettes ?", "El baño está allí.", "èl bagno ésta ayi"], ["Hasta mañana.", "À demain.", "Hasta mañana.", "asta magnana"]]], "family": ["2. Famille", [["¿Cómo está la familia?", "Comment va la famille ?", "La familia está bien.", "la familia ésta biène"], ["¿Tienes hijos?", "As-tu des enfants ?", "Sí, tengo dos hijos.", "si, tèn-go dos ihos"], ["¿Quién es ella?", "Qui est-elle ?", "Ella es mi hermana.", "éya ès mi èrmana"], ["¿Qué has hecho hoy?", "Qu’as-tu fait aujourd’hui ?", "Hoy he ido al mercado.", "oï é ido al markado"], ["¿Quieres comer con nosotros?", "Veux-tu manger avec nous ?", "Sí, con mucho gusto.", "si, kon moutcho gousto"], ["¿A qué hora cenamos?", "À quelle heure dînons-nous ?", "Cenamos a las ocho.", "sénamos a las otcho"], ["¿Te gusta la comida?", "Aimes-tu le repas ?", "Sí, está muy rico.", "si, ésta mouï riko"], ["¿Cómo se llama tu madre?", "Comment s’appelle ta mère ?", "Mi madre se llama Ana.", "mi madré sé yama Ana"], ["¿Vienes mañana?", "Viens-tu demain ?", "Sí, vengo mañana.", "si, bèn-go magnana"], ["Buenas noches, familia.", "Bonne nuit, la famille.", "Buenas noches.", "bouénas notchès"]]], "doctor": ["3. Médecin", [["¿Qué le pasa?", "Qu’est-ce qui vous arrive ?", "Tengo dolor de cabeza.", "tèn-go dolor dé kabéssa"], ["¿Tiene fiebre?", "Avez-vous de la fièvre ?", "Sí, tengo fiebre.", "si, tèn-go fièbré"], ["¿Desde cuándo?", "Depuis quand ?", "Desde ayer.", "dèsdé ayièr"], ["¿Dónde le duele?", "Où avez-vous mal ?", "Me duele el estómago.", "mé douélé èl èstomago"], ["¿Tiene alergias?", "Avez-vous des allergies ?", "Sí, soy alérgica a la penicilina.", "si, soï alèrhika a la pénissilina"], ["¿Toma medicamentos?", "Prenez-vous des médicaments ?", "No tomo medicamentos.", "no tomo médikamèntos"], ["Respire profundamente.", "Respirez profondément.", "De acuerdo.", "dé akouèrdo"], ["Necesita descansar.", "Vous devez vous reposer.", "Gracias, doctor.", "grassias, doktor"], ["¿Necesita una receta?", "Avez-vous besoin d’une ordonnance ?", "Sí, por favor.", "si, por favor"], ["¿Cuándo vuelvo?", "Quand dois-je revenir ?", "Vuelva la próxima semana.", "bouèlba la proksima sémana"]]], "pharmacy": ["4. Pharmacie", [["¿Qué necesita?", "De quoi avez-vous besoin ?", "Necesito algo para el dolor.", "nésséssito algo para èl dolor"], ["¿Tiene receta?", "Avez-vous une ordonnance ?", "Sí, aquí está.", "si, aki ésta"], ["¿Tiene alergias?", "Avez-vous des allergies ?", "No tengo alergias.", "no tèn-go alèrhias"], ["¿Cómo debo tomarlo?", "Comment dois-je le prendre ?", "Una vez al día.", "ouna bèss al dia"], ["¿Antes o después de comer?", "Avant ou après manger ?", "Después de comer.", "dèspouès dé komèr"], ["Necesito una crema.", "J’ai besoin d’une crème.", "¿Para qué?", "para ké"], ["Tengo tos.", "Je tousse.", "Necesito un jarabe.", "nésséssito oun harabé"], ["¿Cuánto cuesta?", "Combien cela coûte ?", "Cuesta ocho euros.", "kouèsta otcho é-ouros"], ["¿Tiene paracetamol?", "Avez-vous du paracétamol ?", "Sí, tenemos.", "si, ténémos"], ["Gracias por su ayuda.", "Merci pour votre aide.", "De nada.", "dé nada"]]], "admin": ["5. Administration", [["¿Tiene cita previa?", "Avez-vous rendez-vous ?", "Sí, tengo cita a las diez.", "si, tèn-go sita a las dièss"], ["¿Tiene el pasaporte?", "Avez-vous le passeport ?", "Sí, aquí lo tiene.", "si, aki lo tiéné"], ["Necesito solicitar el NIE.", "Je dois demander le NIE.", "¿Tiene el formulario?", "tiéné èl formoulario"], ["¿Cuál es su dirección?", "Quelle est votre adresse ?", "Vivo en Alicante.", "bibo èn Alikanté"], ["Firme aquí, por favor.", "Signez ici, s’il vous plaît.", "Sí, claro.", "si, klaro"], ["Falta un documento.", "Il manque un document.", "¿Qué documento falta?", "ké dokoumènto falta"], ["Quiero empadronarme.", "Je veux m’inscrire à la mairie.", "Necesito un certificado.", "nésséssito oun sèrtifikado"], ["¿Cuándo estará listo?", "Quand sera-t-il prêt ?", "Estará listo mañana.", "èstara listo magnana"], ["Necesito una copia.", "J’ai besoin d’une copie.", "Aquí tiene una copia.", "aki tiéné ouna kopia"], ["Gracias, buenos días.", "Merci, bonne journée.", "Buenos días.", "bouénos dias"]]], "bank": ["6. Banque", [["¿En qué puedo ayudarle?", "Comment puis-je vous aider ?", "Quiero abrir una cuenta.", "kièro abrir ouna kouènta"], ["¿Tiene identificación?", "Avez-vous une pièce d’identité ?", "Sí, tengo mi pasaporte.", "si, tèn-go mi passaporté"], ["Necesito una tarjeta.", "J’ai besoin d’une carte.", "¿De débito o crédito?", "dé débito o krédito"], ["Quiero hacer una transferencia.", "Je veux faire un virement.", "¿A qué cuenta?", "a ké kouènta"], ["He perdido mi tarjeta.", "J’ai perdu ma carte.", "Vamos a bloquearla.", "bamos a blokéarla"], ["¿Cuál es la comisión?", "Quels sont les frais ?", "La comisión es de dos euros.", "la komision ès dé dos é-ouros"], ["Quiero retirar dinero.", "Je veux retirer de l’argent.", "El cajero está allí.", "èl kahéro ésta ayi"], ["No recuerdo mi PIN.", "Je ne me souviens pas de mon code PIN.", "Podemos cambiarlo.", "podémos kambiarlo"], ["¿Cuál es mi saldo?", "Quel est mon solde ?", "Su saldo es positivo.", "sou saldo ès positif-o"], ["Gracias por su ayuda.", "Merci pour votre aide.", "De nada.", "dé nada"]]], "insurance": ["7. Assurances", [["¿Qué desea asegurar?", "Que souhaitez-vous assurer ?", "Quiero asegurar mi coche.", "kièro asségourar mi kotché"], ["Quiero pedir un presupuesto.", "Je souhaite demander un devis.", "Necesito sus datos.", "nésséssito sous datos"], ["¿Cuál es la franquicia?", "Quel est le montant de la franchise ?", "La franquicia es de doscientos euros.", "la frankissia ès dé dossièntos é-ouros"], ["Quiero declarar un siniestro.", "Je veux déclarer un sinistre.", "¿Cuándo ocurrió?", "kouando okourio"], ["He tenido un accidente.", "J’ai eu un accident.", "¿Hay heridos?", "aï éridos"], ["Tengo un cristal roto.", "J’ai une vitre cassée.", "Envíe una foto.", "ènbié ouna foto"], ["Necesito asistencia.", "J’ai besoin d’assistance.", "¿Dónde está el vehículo?", "dondé ésta èl bé-ikoulo"], ["Quiero cambiar el contrato.", "Je veux modifier le contrat.", "¿Qué desea cambiar?", "ké désir-a kambiar"], ["¿Está cubierto?", "Est-ce couvert ?", "Sí, está cubierto.", "si, ésta koubièrto"], ["Quiero cancelar la póliza.", "Je veux résilier le contrat.", "Necesitamos una solicitud.", "nésséssitamos ouna solissitoud"]]], "car": ["8. Automobile", [["¿Cuál es el problema?", "Quel est le problème ?", "El coche no arranca.", "èl kotché no arranka"], ["Tengo una rueda pinchada.", "J’ai un pneu crevé.", "Necesito ayuda.", "nésséssito ayouda"], ["Se ha encendido una luz.", "Un voyant s’est allumé.", "¿Qué luz es?", "ké louss ès"], ["Necesito una revisión.", "J’ai besoin d’un entretien.", "¿Para cuándo?", "para kouando"], ["¿Cuánto cuesta la reparación?", "Combien coûte la réparation ?", "Cuesta cien euros.", "kouèsta siène é-ouros"], ["El motor hace ruido.", "Le moteur fait du bruit.", "Vamos a revisarlo.", "bamos a rébissarlo"], ["Necesito pasar la ITV.", "Je dois passer le contrôle technique.", "Pida una cita.", "pida ouna sita"], ["¿Cuándo estará listo?", "Quand sera-t-il prêt ?", "Estará listo esta tarde.", "èstara listo èsta tardé"], ["Necesito una grúa.", "J’ai besoin d’une dépanneuse.", "La grúa está en camino.", "la groua ésta èn kamino"], ["¿Puedo pagar con tarjeta?", "Puis-je payer par carte ?", "Sí, por supuesto.", "si, por sou-pouèsto"]]]};let user='Patricia',cat='daily',idx=0;const base={xp:0,done:{}};let state=JSON.parse(localStorage.getItem('mi80')||'null')||{Patricia:structuredClone(base),'Marie-Christine':structuredClone(base)};const $=id=>document.getElementById(id);function save(){localStorage.setItem('mi80',JSON.stringify(state))}function show(id){['home','learn','progress'].forEach(x=>$(x).classList.toggle('hide',x!==id));render()}function norm(s){return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zñ ]/g,' ').replace(/\s+/g,' ').trim()}function calc(a,b){let x=new Set(norm(a).split(' ').filter(Boolean)),y=norm(b).split(' ').filter(Boolean);return y.length?Math.round(y.filter(w=>x.has(w)).length/y.length*100):0}function chooseCat(c){cat=c;idx=0;renderLearn()}function chooseEx(i){idx=i;renderLearn()}function renderLearn(){let d=DATA[cat],e=d[1][idx];$('catTitle').textContent=d[0];$('q').textContent=e[0];$('fr').textContent=e[1];$('model').textContent=e[2];$('pron').textContent=e[3];$('counter').textContent=`Exercice ${idx+1} sur ${d[1].length}`;$('answer').value='';$('feedback').classList.add('hide');$('check').disabled=true;document.querySelectorAll('#cats button').forEach(b=>b.classList.toggle('on',b.dataset.cat===cat));$('exerciseList').innerHTML=d[1].map((x,i)=>`<button class="${state[user].done[cat+'-'+i]?'done':''}" onclick="chooseEx(${i})">${i+1}. ${x[1]}</button>`).join('')}function render(){let total=Object.keys(state[user].done).length;$('summary').innerHTML=`<div class="card"><b>${total}/80</b><p>Exercices terminés</p></div><div class="card"><b>${state[user].xp}</b><p>XP</p></div><div class="card"><b>A0</b><p>Niveau initial</p></div>`;$('ptitle').textContent='Progression de '+user;$('pstats').innerHTML=`<div class="card"><b>${total}/80</b><p>Terminés</p></div><div class="card"><b>${state[user].xp}</b><p>XP</p></div><div class="card"><b>${Math.round(total/80*100)}%</b><p>Parcours</p></div>`;$('pcats').innerHTML=Object.entries(DATA).map(([c,d])=>{let n=d[1].filter((_,i)=>state[user].done[c+'-'+i]).length;return `<p><b>${d[0]}</b> : ${n}/10</p><div class="progress"><i style="width:${n*10}%"></i></div>`}).join('');renderLearn()}$('cats').innerHTML=Object.entries(DATA).map(([c,d])=>`<button data-cat="${c}" onclick="chooseCat('${c}')">${d[0].replace(/^\d+\. /,'')}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>show(b.dataset.page));document.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>{user=b.dataset.user;document.querySelectorAll('[data-user]').forEach(x=>x.classList.toggle('on',x.dataset.user===user));render()});$('answer').oninput=()=>{$('check').disabled=!$('answer').value.trim();$('feedback').classList.add('hide')};$('listen').onclick=()=>{let v=new SpeechSynthesisUtterance(DATA[cat][1][idx][0]);v.lang='es-ES';speechSynthesis.speak(v)};function assess(t){let n=calc(t,DATA[cat][1][idx][2]);$('score').textContent=n+' %';$('feedback').classList.remove('hide');if(n>=70){state[user].done[cat+'-'+idx]=true;state[user].xp+=15}else state[user].xp+=5;save();render()}$('check').onclick=()=>assess($('answer').value);$('mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;$('err').classList.add('hide');if(!SR){$('err').textContent='Reconnaissance indisponible. Essayez Chrome, Edge ou Safari récent.';$('err').classList.remove('hide');return}let r=new SR();r.lang='es-ES';r.interimResults=false;r.onstart=()=>{$('mic').classList.add('live');$('mic').textContent='🎙️ Je vous écoute…'};r.onend=()=>{$('mic').classList.remove('live');$('mic').textContent='🎤 Répondre au micro'};r.onerror=e=>{$('err').textContent='Erreur micro : '+e.error;$('err').classList.remove('hide')};r.onresult=e=>{$('answer').value=e.results[0][0].transcript;$('check').disabled=false;assess($('answer').value)};r.start()};render();</script></body></html>
